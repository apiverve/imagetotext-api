name: apiverve_imagetotext
description: "Image to Text is an OCR and image to text API that extracts text from image files or remote image URLs using optical character recognition. Upload a JPG, PNG, or GIF up to 5 MB to receive the raw extracted text."
version: 1.2.4
homepage: https://apiverve.com/marketplace/imagetotext?utm_source=dart&utm_medium=referral&utm_content=homepage
repository: https://github.com/apiverve/imagetotext-api/tree/main/dart

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  http: ^1.1.0
  http_parser: ^4.0.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
